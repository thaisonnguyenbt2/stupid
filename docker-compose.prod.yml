version: '3.8'

# Production Docker Compose for 1 OCPU / 1GB RAM (OCI VM.Standard.E2.1.Micro)
# No K3s, no ArgoCD — lightweight auto-deploy via git-pull cron

services:
  trading-db:
    image: mongo:6.0
    container_name: xau-trading-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - trading-net
    deploy:
      resources:
        limits:
          memory: 350M
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25", "--quiet"]

  order-flow-engine:
    build:
      context: ./dxfeed_ingest
    container_name: xau-order-flow
    restart: always
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://trading-db:27017/trading
      - MONGODB_URI=mongodb://trading-db:27017/trading
    depends_on:
      - trading-db
    networks:
      - trading-net
    deploy:
      resources:
        limits:
          memory: 150M

  notification:
    build:
      context: ./services/notification
    container_name: xau-notification
    restart: always
    ports:
      - "4003:4003"
    env_file:
      - .env
    networks:
      - trading-net
    deploy:
      resources:
        limits:
          memory: 80M

volumes:
  mongo-data:

networks:
  trading-net:
    driver: bridge
